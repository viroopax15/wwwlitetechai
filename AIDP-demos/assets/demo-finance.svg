  <text x="102" y="294" fill="#4da3ff" font-family="Menlo, Consolas, monospace" font-size="13">-> explainability packet ready</text>
  <g fill="#121d2d" stroke="#22314a">
    <rect x="462" y="138" width="174" height="130" rx="16"/>
    <rect x="668" y="138" width="174" height="130" rx="16"/>
    <rect x="462" y="304" width="380" height="130" rx="16"/>
  </g>
  <text x="486" y="176" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">6 hrs -> 2 min</text>
  <text x="486" y="206" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="13">Risk recalculation</text>
  <text x="692" y="176" fill="#4da3ff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">90%</text>
  <text x="692" y="206" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="13">GPU utilization target</text>
  <text x="486" y="342" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Live intelligence architecture</text>
  <path d="M498 384h82m38 0h82m38 0h66" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round"/>
  <g fill="#0b1320" stroke="#4da3ff">
