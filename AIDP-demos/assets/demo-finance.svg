<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Financial analysis demo screen</title>
  <desc id="desc">A financial intelligence dashboard with risk terminal, portfolio metrics, and architecture flow.</desc>
  <rect width="960" height="540" rx="28" fill="#07111d"/>
  <rect x="44" y="34" width="872" height="472" rx="22" fill="#0e1624" stroke="#23324b"/>
  <text x="76" y="76" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Financial Analysis 2.0</text>
  <text x="76" y="103" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="14">Intraday risk, surveillance, and explainability on governed market data</text>
  <rect x="76" y="138" width="352" height="296" rx="16" fill="#05080d" stroke="#22314a"/>
  <text x="102" y="174" fill="#b7f7d0" font-family="Menlo, Consolas, monospace" font-size="13">$ load portfolio --positions 18M</text>
  <text x="102" y="204" fill="#b7f7d0" font-family="Menlo, Consolas, monospace" font-size="13">$ run scenarios --gpu-pool</text>
