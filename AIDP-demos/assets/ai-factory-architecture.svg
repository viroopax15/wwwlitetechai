<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI factory data plane with application, orchestration, monetization, and agent layers</title>
  <desc id="desc">A generic AI factory architecture diagram showing users consuming AI agents above AI applications, orchestration, monetization, invocation, model, data, GPU, and operations layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#4da3ff"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" x2="1">
      <stop offset="0" stop-color="#8bd450"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-18%" width="116%" height="136%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <g opacity=".18" stroke="#4da3ff" stroke-width="1">
    <path d="M54 116h852M54 170h852M54 224h852M54 278h852M54 332h852M54 386h852M54 440h852"/>
    <path d="M120 82v390M240 82v390M360 82v390M480 82v390M600 82v390M720 82v390M840 82v390"/>
  </g>
  <text x="54" y="52" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">AI Factory Data Plane</text>
  <text x="54" y="80" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="14">A layered operating model from enterprise data to monetized AI apps, agents, and users</text>

  <g filter="url(#shadow)">
    <rect x="70" y="104" width="820" height="54" rx="16" fill="#12251f" stroke="#8bd450"/>
    <text x="96" y="138" fill="#eaffdf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Users consume AI Agents</text>
    <g fill="#07111d" stroke="#8bd450">
      <circle cx="704" cy="131" r="18"/>
      <circle cx="760" cy="131" r="18"/>
      <circle cx="816" cy="131" r="18"/>
    </g>
    <g fill="#8bd450">
      <circle cx="704" cy="126" r="5"/><path d="M692 142c6-10 18-10 24 0"/>
      <circle cx="760" cy="126" r="5"/><path d="M748 142c6-10 18-10 24 0"/>
      <circle cx="816" cy="126" r="5"/><path d="M804 142c6-10 18-10 24 0"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="178" width="250" height="78" rx="16" fill="#121d2d" stroke="#2dd4bf"/>
    <text x="96" y="208" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">AI Applications</text>
    <text x="96" y="232" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="12">Copilots · dashboards · APIs</text>
    <text x="96" y="248" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="11">Domain workflows grounded in enterprise data</text>

    <rect x="355" y="178" width="250" height="78" rx="16" fill="#121d2d" stroke="#4da3ff"/>
    <text x="381" y="208" fill="#4da3ff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Orchestration</text>
    <text x="381" y="232" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="12">Routing · tools · guardrails</text>
    <text x="381" y="248" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="11">Agent plans, function calls, and workflow state</text>

    <rect x="640" y="178" width="250" height="78" rx="16" fill="#121d2d" stroke="#f59e0b"/>
    <text x="666" y="208" fill="#f59e0b" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Monetization</text>
    <text x="666" y="232" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="12">Usage · chargeback · catalogs</text>
    <text x="666" y="248" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="11">Token cost, tenants, SLAs, and business value</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="282" width="820" height="62" rx="16" fill="#0e1624" stroke="#22314a"/>
    <text x="96" y="318" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Invocation and Control Plane</text>
    <text x="304" y="318" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="12">API gateway · request routing · rate limits · deployment state · secrets · observability</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="368" width="185" height="92" rx="16" fill="#121d2d" stroke="#22314a"/>
    <text x="96" y="400" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Enterprise Data</text>
    <text x="96" y="424" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="12">Files · objects · DBs</text>
    <text x="96" y="442" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="11">Lineage and access policy</text>

    <rect x="285" y="368" width="185" height="92" rx="16" fill="#121d2d" stroke="#2dd4bf"/>
    <text x="311" y="400" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Retrieval Services</text>
    <text x="311" y="424" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="12">Extract · embed · index</text>
    <text x="311" y="442" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="11">Search, rerank, cite</text>

    <rect x="500" y="368" width="185" height="92" rx="16" fill="#121d2d" stroke="#4da3ff"/>
    <text x="526" y="400" fill="#4da3ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Model Runtime</text>
    <text x="526" y="424" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="12">Inference · batch · tuning</text>
    <text x="526" y="442" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="11">GPU-accelerated workloads</text>

    <rect x="715" y="368" width="175" height="92" rx="16" fill="#121d2d" stroke="#8bd450"/>
    <text x="741" y="400" fill="#8bd450" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Factory Ops</text>
    <text x="741" y="424" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="12">Health · power · capacity</text>
    <text x="741" y="442" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="11">Tenant and fleet visibility</text>
  </g>

  <path d="M480 158v20" stroke="url(#agent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M195 256v26M480 256v26M765 256v26" stroke="url(#edge)" stroke-width="5" stroke-linecap="round"/>
  <path d="M162 344v24M377 344v24M592 344v24M802 344v24" stroke="url(#edge)" stroke-width="5" stroke-linecap="round"/>
  <path d="M255 414h30M470 414h30M685 414h30" stroke="url(#edge)" stroke-width="5" stroke-linecap="round"/>
  <rect x="210" y="488" width="540" height="30" rx="15" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)"/>
  <text x="260" y="508" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Measure tokens, utilization, latency, quality, policy, cost, and revenue outcomes</text>
</svg>
