<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Generic AI factory architecture</title>
  <desc id="desc">A neutral architecture diagram showing enterprise data flowing into storage, retrieval services, GPU services, and AI apps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#4da3ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <g opacity=".24" stroke="#4da3ff" stroke-width="1">
    <path d="M90 96h780M90 168h780M90 240h780M90 312h780M90 384h780M90 456h780"/>
    <path d="M144 70v400M264 70v400M384 70v400M504 70v400M624 70v400M744 70v400"/>
  </g>
  <text x="54" y="58" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">AI Factory Data Plane</text>
  <text x="54" y="88" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="15">From raw enterprise data to trusted agents, apps, and copilots</text>
  <g filter="url(#shadow)">
    <rect x="62" y="142" width="170" height="262" rx="18" fill="#121d2d" stroke="#22314a"/>
    <text x="86" y="178" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Data Sources</text>
    <text x="86" y="218" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="14">Files</text>
    <text x="86" y="252" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="14">Objects</text>
    <text x="86" y="286" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="14">Databases</text>
    <text x="86" y="320" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="14">Media</text>
    <text x="86" y="354" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="14">App logs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="296" y="122" width="182" height="302" rx="18" fill="#0e1624" stroke="#2dd4bf"/>
    <text x="326" y="160" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Storage Fabric</text>
    <rect x="324" y="194" width="126" height="34" rx="8" fill="#163044" stroke="#2dd4bf"/>
    <text x="348" y="216" fill="#d7fffb" font-family="Inter, Arial, sans-serif" font-size="13">Hot cache</text>
    <rect x="324" y="246" width="126" height="34" rx="8" fill="#163044" stroke="#2dd4bf"/>
    <text x="348" y="268" fill="#d7fffb" font-family="Inter, Arial, sans-serif" font-size="13">Metadata</text>
    <rect x="324" y="298" width="126" height="34" rx="8" fill="#163044" stroke="#2dd4bf"/>
    <text x="348" y="320" fill="#d7fffb" font-family="Inter, Arial, sans-serif" font-size="13">Governance</text>
    <rect x="324" y="350" width="126" height="34" rx="8" fill="#163044" stroke="#2dd4bf"/>
    <text x="348" y="372" fill="#d7fffb" font-family="Inter, Arial, sans-serif" font-size="13">Lineage</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="542" y="122" width="182" height="302" rx="18" fill="#0e1624" stroke="#4da3ff"/>
    <text x="574" y="160" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">AI Services</text>
    <rect x="570" y="194" width="126" height="34" rx="8" fill="#122f57" stroke="#4da3ff"/>
    <text x="592" y="216" fill="#dceeff" font-family="Inter, Arial, sans-serif" font-size="13">Extract</text>
    <rect x="570" y="246" width="126" height="34" rx="8" fill="#122f57" stroke="#4da3ff"/>
    <text x="592" y="268" fill="#dceeff" font-family="Inter, Arial, sans-serif" font-size="13">Embed</text>
    <rect x="570" y="298" width="126" height="34" rx="8" fill="#122f57" stroke="#4da3ff"/>
    <text x="592" y="320" fill="#dceeff" font-family="Inter, Arial, sans-serif" font-size="13">Rerank</text>
    <rect x="570" y="350" width="126" height="34" rx="8" fill="#122f57" stroke="#4da3ff"/>
    <text x="592" y="372" fill="#dceeff" font-family="Inter, Arial, sans-serif" font-size="13">Infer</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="782" y="142" width="126" height="262" rx="18" fill="#121d2d" stroke="#8bd450"/>
    <text x="814" y="178" fill="#8bd450" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Apps</text>
    <text x="812" y="224" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="14">Agents</text>
    <text x="812" y="262" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="14">Copilots</text>
    <text x="812" y="300" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="14">Dashboards</text>
    <text x="812" y="338" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="14">APIs</text>
  </g>
  <path d="M232 274h64" stroke="url(#edge)" stroke-width="6" stroke-linecap="round"/>
  <path d="M478 274h64" stroke="url(#edge)" stroke-width="6" stroke-linecap="round"/>
  <path d="M724 274h58" stroke="url(#edge)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="264" cy="274" r="8" fill="#2dd4bf"/>
  <circle cx="510" cy="274" r="8" fill="#2dd4bf"/>
  <circle cx="754" cy="274" r="8" fill="#2dd4bf"/>
  <rect x="218" y="456" width="524" height="42" rx="21" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)"/>
  <text x="264" y="483" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Observe cost, quality, throughput, policy, and usage across the pipeline</text>
</svg>
