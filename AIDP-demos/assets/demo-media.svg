  <rect x="76" y="140" width="396" height="252" rx="16" fill="#05080d" stroke="#22314a"/>
  <rect x="104" y="170" width="148" height="86" rx="12" fill="#122f57"/>
  <rect x="276" y="170" width="148" height="86" rx="12" fill="#163044"/>
