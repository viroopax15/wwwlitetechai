  <path d="M332 208l26 18 26-44" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round"/>
  <path d="M126 326h96M126 344h74" stroke="#a9b7c8" stroke-width="7" stroke-linecap="round"/>
