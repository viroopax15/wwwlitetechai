<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">RAG indexing and generating architecture</title>
  <desc id="desc">A retrieval augmented generation architecture showing indexing from documents through parser, chunks, embedder, and datastore, then generating from query through embedder, retrieval, LLM, and answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="1" stop-color="#0e1624"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#4da3ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path d="M0 0l8 4-8 4z" fill="#a9b7c8"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <g opacity=".18" stroke="#4da3ff" stroke-width="1">
    <path d="M58 92h844M58 188h844M58 284h844M58 380h844M58 476h844"/>
    <path d="M140 70v410M260 70v410M380 70v410M500 70v410M620 70v410M740 70v410M860 70v410"/>
  </g>
  <text x="54" y="54" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">RAG Architecture</text>
  <text x="54" y="82" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="14">Index once, retrieve relevant context at query time, then generate grounded answers with citations</text>

  <g filter="url(#shadow)">
    <rect x="54" y="112" width="852" height="150" rx="20" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
    <text x="78" y="146" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Indexing</text>
    <text x="78" y="170" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="12">Build a searchable knowledge index from approved enterprise content.</text>

    <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
      <rect x="84" y="192" width="112" height="46" rx="12" fill="#121d2d" stroke="#4da3ff"/>
      <text x="140" y="220" fill="#f8fafc" font-size="13" font-weight="800">Documents</text>
      <rect x="242" y="188" width="128" height="54" rx="12" fill="#15362f" stroke="#2dd4bf"/>
      <text x="306" y="211" fill="#d7fffb" font-size="13" font-weight="800">Parser /</text>
      <text x="306" y="229" fill="#d7fffb" font-size="13" font-weight="800">Splitter</text>
      <rect x="420" y="192" width="112" height="46" rx="12" fill="#121d2d" stroke="#4da3ff"/>
      <text x="476" y="220" fill="#f8fafc" font-size="13" font-weight="800">Text chunks</text>
      <rect x="582" y="188" width="128" height="54" rx="12" fill="#15362f" stroke="#2dd4bf"/>
      <text x="646" y="220" fill="#d7fffb" font-size="13" font-weight="800">Embedder</text>
      <rect x="768" y="188" width="104" height="54" rx="12" fill="#15253b" stroke="#8bd450"/>
      <text x="820" y="211" fill="#efffe7" font-size="13" font-weight="800">Datastore</text>
      <text x="820" y="229" fill="#efffe7" font-size="13" font-weight="800">Index</text>
    </g>
    <path d="M198 215h38M372 215h42M534 215h42M712 215h50" stroke="#a9b7c8" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="54" y="302" width="852" height="172" rx="20" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
    <text x="78" y="336" fill="#4da3ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Generating</text>
    <text x="78" y="360" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="12">Embed the query, retrieve matching context, and give the LLM evidence before producing an answer.</text>

    <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
      <rect x="82" y="392" width="94" height="46" rx="12" fill="#121d2d" stroke="#4da3ff"/>
      <text x="129" y="420" fill="#f8fafc" font-size="13" font-weight="800">Query</text>
      <rect x="224" y="388" width="120" height="54" rx="12" fill="#15362f" stroke="#2dd4bf"/>
      <text x="284" y="420" fill="#d7fffb" font-size="13" font-weight="800">Embedder</text>
      <rect x="390" y="388" width="120" height="54" rx="12" fill="#15253b" stroke="#8bd450"/>
      <text x="450" y="411" fill="#efffe7" font-size="13" font-weight="800">Datastore</text>
      <text x="450" y="429" fill="#efffe7" font-size="13" font-weight="800">Index</text>
      <rect x="548" y="388" width="134" height="54" rx="12" fill="#121d2d" stroke="#4da3ff"/>
      <text x="615" y="411" fill="#f8fafc" font-size="13" font-weight="800">Retrieved</text>
      <text x="615" y="429" fill="#f8fafc" font-size="13" font-weight="800">text chunks</text>
      <rect x="724" y="388" width="96" height="54" rx="12" fill="#15362f" stroke="#2dd4bf"/>
      <text x="772" y="420" fill="#d7fffb" font-size="13" font-weight="800">LLM</text>
      <rect x="852" y="392" width="62" height="46" rx="12" fill="#12251f" stroke="#8bd450"/>
      <text x="883" y="420" fill="#efffe7" font-size="13" font-weight="800">Answer</text>
    </g>
    <path d="M178 415h40M346 415h38M512 415h30M684 415h34M822 415h24" stroke="#a9b7c8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M450 388c42-48 126-48 165 0" fill="none" stroke="url(#blue)" stroke-width="4" stroke-linecap="round"/>
    <text x="514" y="372" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="11">semantic search</text>
  </g>

  <rect x="210" y="494" width="540" height="28" rx="14" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)"/>
  <text x="250" y="513" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Inspired by NeMo RAG pipeline concepts: indexing + generation with retrieved context</text>
</svg>
