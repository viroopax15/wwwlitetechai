<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Multimedia intelligence architecture</title>
  <desc id="desc">A generic video search and summarization architecture showing media sources, ingestion, visual understanding, hybrid retrieval, agent workflows, and governed actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="1" stop-color="#0e1624"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#4da3ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path d="M0 0l8 4-8 4z" fill="#a9b7c8"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <g opacity=".16" stroke="#4da3ff" stroke-width="1">
    <path d="M58 94h844M58 190h844M58 286h844M58 382h844M58 478h844"/>
    <path d="M140 72v408M260 72v408M380 72v408M500 72v408M620 72v408M740 72v408M860 72v408"/>
  </g>

  <text x="54" y="54" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Multimedia Intelligence Architecture</text>
  <text x="54" y="82" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="14">Ingest rich media, extract multimodal signals, retrieve evidence, and drive agentic operations.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="112" width="852" height="86" rx="20" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
    <text x="78" y="146" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Media sources</text>
    <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
      <rect x="222" y="132" width="96" height="42" rx="12" fill="#121d2d" stroke="#4da3ff"/>
      <text x="270" y="158" fill="#f8fafc" font-size="12" font-weight="800">Video</text>
      <rect x="342" y="132" width="96" height="42" rx="12" fill="#121d2d" stroke="#4da3ff"/>
      <text x="390" y="158" fill="#f8fafc" font-size="12" font-weight="800">Images</text>
      <rect x="462" y="132" width="96" height="42" rx="12" fill="#121d2d" stroke="#4da3ff"/>
      <text x="510" y="158" fill="#f8fafc" font-size="12" font-weight="800">Audio</text>
      <rect x="582" y="132" width="116" height="42" rx="12" fill="#121d2d" stroke="#4da3ff"/>
      <text x="640" y="158" fill="#f8fafc" font-size="12" font-weight="800">Metadata</text>
      <rect x="722" y="132" width="118" height="42" rx="12" fill="#121d2d" stroke="#4da3ff"/>
      <text x="781" y="158" fill="#f8fafc" font-size="12" font-weight="800">Documents</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="54" y="230" width="852" height="120" rx="20" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
    <text x="78" y="264" fill="#4da3ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Ingest + understand</text>
    <text x="78" y="288" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="12">Sample frames, transcribe speech, read text, create captions, detect events, and create embeddings.</text>
    <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
      <rect x="116" y="306" width="112" height="42" rx="12" fill="#15362f" stroke="#2dd4bf"/>
      <text x="172" y="332" fill="#d7fffb" font-size="12" font-weight="800">Frame sampler</text>
      <rect x="262" y="306" width="106" height="42" rx="12" fill="#15362f" stroke="#2dd4bf"/>
      <text x="315" y="332" fill="#d7fffb" font-size="12" font-weight="800">OCR + ASR</text>
      <rect x="402" y="306" width="118" height="42" rx="12" fill="#15362f" stroke="#2dd4bf"/>
      <text x="461" y="332" fill="#d7fffb" font-size="12" font-weight="800">VLM captions</text>
      <rect x="554" y="306" width="118" height="42" rx="12" fill="#15362f" stroke="#2dd4bf"/>
      <text x="613" y="332" fill="#d7fffb" font-size="12" font-weight="800">Embeddings</text>
      <rect x="706" y="306" width="118" height="42" rx="12" fill="#15362f" stroke="#2dd4bf"/>
      <text x="765" y="332" fill="#d7fffb" font-size="12" font-weight="800">Event tags</text>
    </g>
    <path d="M236 327h20M376 327h20M528 327h20M680 327h20" stroke="#a9b7c8" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <path d="M480 198v28" stroke="#a9b7c8" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="54" y="382" width="420" height="92" rx="20" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
    <text x="78" y="416" fill="#8bd450" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Hybrid retrieval layer</text>
    <text x="78" y="440" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="12">Vector, metadata, event, graph, transcript, and object indexes keep moments searchable with lineage.</text>
    <rect x="78" y="452" width="340" height="8" rx="4" fill="rgba(255,255,255,.08)"/>
    <rect x="78" y="452" width="266" height="8" rx="4" fill="url(#blue)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="514" y="382" width="392" height="92" rx="20" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
    <text x="538" y="416" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Agent workflows</text>
    <text x="538" y="440" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="12">Search, summarize, verify alerts, answer questions, and route evidence to operations teams.</text>
    <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
      <rect x="544" y="452" width="78" height="24" rx="12" fill="#12251f" stroke="#8bd450"/>
      <text x="583" y="468" fill="#efffe7" font-size="10" font-weight="800">Search</text>
      <rect x="636" y="452" width="88" height="24" rx="12" fill="#12251f" stroke="#8bd450"/>
      <text x="680" y="468" fill="#efffe7" font-size="10" font-weight="800">Summarize</text>
      <rect x="738" y="452" width="74" height="24" rx="12" fill="#12251f" stroke="#8bd450"/>
      <text x="775" y="468" fill="#efffe7" font-size="10" font-weight="800">Alerts</text>
    </g>
  </g>

  <path d="M480 350v32M474 428h34" stroke="#a9b7c8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M262 382c28-32 90-32 118 0" fill="none" stroke="url(#blue)" stroke-width="4" stroke-linecap="round"/>
  <text x="272" y="374" fill="#a9b7c8" font-family="Inter, Arial, sans-serif" font-size="11">semantic + temporal search</text>

  <rect x="214" y="496" width="532" height="28" rx="14" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)"/>
  <text x="246" y="515" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Generic VSS-style blueprint: real-time media intelligence + downstream analytics + agent tools</text>
</svg>
